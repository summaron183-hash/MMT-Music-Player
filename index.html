<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Web Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>Web Music Player</h1>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search song or artist...">
      <button id="search-btn">Search</button>
    </div>

    <!-- Hidden Video Canvas for Floating Picture-in-Picture -->
    <div class="pip-container">
      <video id="pip-video" autoplay muted playsinline></video>
      <canvas id="pip-canvas" width="600" height="600"></canvas>
    </div>

    <!-- Main Player Display -->
    <div class="player-card">
      <img id="track-cover" src="https://via.placeholder.com/300" alt="Cover Art">
      <h2 id="track-title">Select a Song</h2>
      <p id="track-artist">Artist Name</p>

      <!-- Native Audio Element -->
      <audio id="main-audio" controls crossorigin="anonymous"></audio>

      <!-- Extra Controls -->
      <div class="control-actions">
        <button id="fav-btn">❤️ Save Favorite</button>
        <button id="download-mp3-btn">⬇️ Download Song</button>
        <button id="pip-btn">📺 Floating PiP Mode</button>
      </div>
    </div>

    <!-- Lyrics & Favorites Tabs -->
    <div class="content-sections">
      <div class="lyrics-section">
        <h3>Lyrics</h3>
        <button id="download-lyrics-btn">Download Lyrics (.txt)</button>
        <pre id="lyrics-display">Lyrics will show up here when playing a track...</pre>
      </div>

      <div class="favorites-section">
        <h3>Saved Favorites (Local Storage)</h3>
        <ul id="favorites-list"></ul>
      </div>
    </div>

    <!-- Search Results List -->
    <div class="results-section">
      <h3>Search Results</h3>
      <div id="results-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
